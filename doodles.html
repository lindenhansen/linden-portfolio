<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doodles — Linden Hansen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon/favicon.png">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root { color-scheme: light; }

    body {
      background: #ffffff;
      color: #000000;
      font-family: 'IM Fell English', serif;
      height: 100vh;
      overflow: hidden;
    }

    a { color: #000000; text-decoration: none; }
    a:hover { color: #49739D; text-decoration: none; }

    /* ── HEADER ───────────────────────────────────────────── */

    header {
      height: 76px;
      text-align: center;
      padding: 28px 0 0;
    }

    .logo-link { display: inline-block; line-height: 0; }
    .logo-link:hover { color: inherit; }
    .logo-link img { height: 44px; width: auto; display: block; transition: filter 0.2s ease; }
    .logo-link:hover img { filter: brightness(0) saturate(100%) invert(43%) sepia(16%) saturate(1109%) hue-rotate(175deg) brightness(93%); }

    /* ── THREE-COLUMN LAYOUT ──────────────────────────────── */

    .page {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      height: calc(100vh - 76px);
      overflow: hidden;
    }

    /* ── LEFT COLUMN: persistent nav ─────────────────────── */

    .col-left {
      padding-top: 33vh;
      padding-left: 3.5vw;
      padding-right: 1.5vw;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: max-content 1fr;
      column-gap: 18px;
      row-gap: 14px;
      align-items: baseline;
    }

    .cat {
      font-style: italic;
      font-size: 22px;
      line-height: 1.3;
      text-align: right;
      white-space: nowrap;
    }

    .desc {
      font-size: 13px;
      line-height: 1.55;
      text-align: justify;
    }

    .nav-spacer { grid-column: 1 / -1; height: 14px; }
    .ext-pad { display: block; }
    .ext { font-style: italic; font-size: 13px; line-height: 1.65; }

    /* ── MIDDLE COLUMN: scrollable image stack ────────────── */

    .col-mid {
      padding: 1.5vw;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .gallery img {
      display: block;
      cursor: zoom-in;
      transition: transform 0.2s ease;
    }

    .gallery img:hover {
      transform: scale(0.97);
    }

    /* ── RIGHT COLUMN: project description ───────────────── */

    .col-right {
      padding: 1.5vw;
      padding-top: 33vh;
    }

    .project-desc {
      font-style: normal;
      font-size: 13px;
      line-height: 1.6;
      color: #000000;
    }

    .project-desc p + p {
      margin-top: 1.2em;
    }

    /* ── LIGHTBOX ─────────────────────────────────────────── */

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      justify-content: center;
      align-items: center;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
    }

    .lightbox-inner {
      position: relative;
      z-index: 1000;
      max-width: 72vw;
      max-height: 82vh;
      overflow: hidden;
    }

    .lightbox-inner img {
      display: block;
      max-width: 100%;
      max-height: 82vh;
      object-fit: contain;
    }


    /* ── MOBILE ───────────────────────────────────────────── */

    .hamburger {
      display: none;
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #000000;
      padding: 0 4px;
      line-height: 1;
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
    }

    .nav-close {
      display: none;
    }

    @media (max-width: 768px) {
      header {
        position: relative;
      }

      .hamburger {
        display: block;
      }

      /* Nav slides over full screen */
      .col-left {
        display: none;
        position: fixed;
        inset: 0;
        background: #ffffff;
        z-index: 500;
        padding: 80px 8vw 8vw;
        overflow-y: auto;
        padding-top: 80px;
      }

      .col-left.nav-open {
        display: block;
      }

      .nav-close {
        display: block;
        position: absolute;
        top: 20px;
        right: 20px;
        background: none;
        border: none;
        font-size: 22px;
        cursor: pointer;
        color: #000000;
        font-family: 'IM Fell English', serif;
        padding: 0;
        line-height: 1;
      }

      /* Single-column layout */
      .page {
        grid-template-columns: 1fr !important;
        height: auto !important;
        overflow: visible !important;
      }

      body {
        height: auto !important;
        overflow-x: hidden;
        overflow-y: auto;
      }

      .col-right {
        display: block !important;
        padding: 2vh 4vw 4vh !important;
      }

      .col-mid {
        height: auto !important;
        overflow: visible !important;
        min-height: calc(100vh - 76px);
        padding: 1.5vh 4vw;
      }

      /* Single images in scrollable pages */
      .col-mid > img,
      .col-mid .row-2 img,
      .col-mid .row-3 img,
      .col-mid .row-4 img,
      .thumb {
        width: 100% !important;
        height: auto !important;
      }

      /* Multi-image rows become single column */
      .row-2, .row-3, .row-4 {
        flex-direction: column !important;
      }

      .row-2 img, .row-3 img, .row-4 img {
        width: 100% !important;
        flex: none !important;
      }
    }
  </style>
</head>
<body>

    <a href="about.html" class="logo-link">

  <button class="hamburger" id="hamburger">&#9776;</button>
  </header>

  <div class="page">

    <!-- LEFT: persistent navigation -->
    <div class="col-left">
      <button class="nav-close" id="nav-close">&#x2715;</button>
      <div class="nav-grid">

        <a class="cat" href="product.html">PRODUCT</a>

        <span class="ext-pad"></span>

        <div class="nav-spacer"></div>

        <span class="ext-pad"></span>

        <span class="ext-pad"></span>

    <!-- MIDDLE: justified gallery, scrollable -->
    <div class="col-mid">
      <div class="gallery" id="gallery">
        <img src="other/doodles/doodles1-p1.png" alt="Doodle 1" data-ratio="1.4783">
        <img src="other/doodles/doodles2-p1.png" alt="Doodle 2" data-ratio="1.7895">
        <img src="other/doodles/doodles3-p1.png" alt="Doodle 3" data-ratio="1.4392">
        <img src="other/doodles/doodles4-p1.png" alt="Doodle 4" data-ratio="1.5753">
        <img src="other/doodles/doodles5.png" alt="Doodle 5" data-ratio="1.4090">
        <img src="other/doodles/doodles6.png" alt="Doodle 6" data-ratio="1.3240">
        <img src="other/doodles/doodles7.png" alt="Doodle 7" data-ratio="1.5430">
        <img src="other/doodles/doodles8.png" alt="Doodle 8" data-ratio="1.4170">
      </div>
    </div>

    <!-- RIGHT: project description -->
    <div class="col-right">
      <div class="project-desc">
        <p>A collection of doodles.</p>

    </div>

  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-overlay" id="lb-overlay"></div>
    <div class="lightbox-inner">
      <img id="lb-img" src="" alt="">
    </div>
  </div>

  <script>
    // Justified gallery layout (no cropping — each row scaled to a shared height)
    (function() {
      const gallery = document.getElementById('gallery');
      if (!gallery) return;
      const imgs = Array.from(gallery.querySelectorAll('img'));
      const gap = 4;
      const targetHeight = 220;
      const maxHeight = 340;

      function layout() {
        const containerWidth = gallery.clientWidth;
        let row = [];
        let rowAspectSum = 0;

        function finalizeRow(stretch) {
          if (!row.length) return;
          let rowHeight = targetHeight;
          if (stretch) {
            rowHeight = Math.min(maxHeight, (containerWidth - gap * (row.length - 1)) / rowAspectSum);
          }
          row.forEach(img => {
            const ratio = parseFloat(img.dataset.ratio);
            img.style.width = (ratio * rowHeight) + 'px';
            img.style.height = rowHeight + 'px';
          });
          row = [];
          rowAspectSum = 0;
        }

        imgs.forEach((img, i) => {
          const ratio = parseFloat(img.dataset.ratio);
          row.push(img);
          rowAspectSum += ratio;
          const rowWidthAtTarget = rowAspectSum * targetHeight + gap * (row.length - 1);
          if (rowWidthAtTarget >= containerWidth) {
            finalizeRow(true);
          } else if (i === imgs.length - 1) {
            finalizeRow(false);
          }
        });
      }

      layout();
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(layout, 100);
      });
    })();
  </script>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lbImg    = document.getElementById('lb-img');

    function openImg(src) {
      lbImg.src = src;
      lightbox.classList.add('open');
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
    }

    document.querySelectorAll('.gallery img').forEach(img => {
      img.addEventListener('click', () => openImg(img.src));
    });

    document.getElementById('lb-overlay').addEventListener('click', closeLightbox);

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>


  <script>
    // Mobile nav toggle
    (function() {
      const hamburger = document.getElementById('hamburger');
      const colLeft   = document.querySelector('.col-left');
      const navClose  = document.getElementById('nav-close');
      if (!hamburger || !colLeft) return;
      hamburger.addEventListener('click', () => colLeft.classList.toggle('nav-open'));
      if (navClose) navClose.addEventListener('click', () => colLeft.classList.remove('nav-open'));
      colLeft.querySelectorAll('a').forEach(a => {
        a.addEventListener('click', () => colLeft.classList.remove('nav-open'));
      });
    })();
  </script>
</body>
