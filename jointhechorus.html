<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join the Chorus — Linden Hansen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon/favicon.png">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root { color-scheme: light; }

    body {
      background: #ffffff;
      color: #000000;
      font-family: 'IM Fell English', serif;
      height: 100vh;
      overflow: hidden;
    }

    a { color: #000000; text-decoration: none; }
    a:hover { color: #49739D; text-decoration: none; }

    header {
      height: 76px;
      text-align: center;
      padding: 28px 0 0;
    }

    .logo-link { display: inline-block; line-height: 0; }
    .logo-link:hover { color: inherit; }
    .logo-link img { height: 44px; width: auto; display: block; transition: filter 0.2s ease; }
    .logo-link:hover img { filter: brightness(0) saturate(100%) invert(43%) sepia(16%) saturate(1109%) hue-rotate(175deg) brightness(93%); }

    .page {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      height: calc(100vh - 76px);
      overflow: hidden;
    }

    .col-left {
      padding-top: 33vh;
      padding-left: 3.5vw;
      padding-right: 1.5vw;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: max-content 1fr;
      column-gap: 18px;
      row-gap: 14px;
      align-items: baseline;
    }

    .cat {
      font-style: italic;
      font-size: 22px;
      line-height: 1.3;
      text-align: right;
      white-space: nowrap;
    }

    .desc {
      font-size: 13px;
      line-height: 1.55;
      text-align: justify;
    }

    .nav-spacer { grid-column: 1 / -1; height: 14px; }
    .ext-pad { display: block; }
    .ext { font-style: italic; font-size: 13px; line-height: 1.65; }

    .col-mid {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .col-mid p {
      font-style: italic;
      font-size: 13px;
      color: #000000;
    }

    .col-right {
      padding: 1.5vw;
      padding-top: 33vh;
    }


    /* ── MOBILE ───────────────────────────────────────────── */

    .hamburger {
      display: none;
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #000000;
      padding: 0 4px;
      line-height: 1;
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
    }

    .nav-close {
      display: none;
    }

    @media (max-width: 768px) {
      header {
        position: relative;
      }

      .hamburger {
        display: block;
      }

      .col-left {
        display: none;
        position: fixed;
        inset: 0;
        background: #ffffff;
        z-index: 500;
        padding: 80px 8vw 8vw;
        overflow-y: auto;
        padding-top: 80px;
      }

      .col-left.nav-open {
        display: block;
      }

      .nav-close {
        display: block;
        position: absolute;
        top: 20px;
        right: 20px;
        background: none;
        border: none;
        font-size: 22px;
        cursor: pointer;
        color: #000000;
        font-family: 'IM Fell English', serif;
        padding: 0;
        line-height: 1;
      }

      .page {
        grid-template-columns: 1fr !important;
        height: auto !important;
        overflow: visible !important;
      }

      body {
        height: auto !important;
        overflow-x: hidden;
        overflow-y: auto;
      }

      .col-right {
        display: block !important;
        padding: 2vh 4vw 4vh !important;
      }

      .col-mid {
        height: auto !important;
        overflow: visible !important;
        min-height: calc(100vh - 76px);
        padding: 1.5vh 4vw;
      }

      .col-mid p {
        padding-top: 40vh;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="about.html" class="logo-link">
      <img src="logo/logo.png" alt="CB">
    </a>
  <button class="hamburger" id="hamburger">&#9776;</button>
  </header>

  <div class="page">

    <div class="col-left">
      <button class="nav-close" id="nav-close">&#x2715;</button>
      <div class="nav-grid">

        <a class="cat" href="product.html">PRODUCT</a>
        <span class="desc">Building things for humans.</span>

        <a class="cat" href="strategy.html">STRATEGY</a>
        <span class="desc">Architecting brand positioning through product-culture fit.</span>

        <a class="cat" href="design.html">DESIGN</a>
        <span class="desc">Playing with color, space, word, and tone.</span>

        <a class="cat" href="photo.html">PHOTO</a>
        <span class="desc">Capturing life and loved ones.</span>

        <a class="cat" href="other.html">OTHER</a>
        <span class="desc">Just for fun.</span>

        <div class="nav-spacer"></div>

        <span class="ext-pad"></span>
        <a class="ext" href="bio.html">BIO</a>

        <span class="ext-pad"></span>
        <a class="ext" href="https://www.linkedin.com/in/linden-hansen/" target="_blank">LINKEDIN</a>

        <span class="ext-pad"></span>
        <a class="ext" href="mailto:lindenh@stanford.edu">EMAIL</a>

        <div class="nav-spacer"></div>

        <span class="ext-pad"></span>
        <a class="ext" href="https://brandnewgirl.substack.com/" target="_blank">SUBSTACK</a>

        <span class="ext-pad"></span>
        <a class="ext" href="https://www.are.na/linden-hansen/channels" target="_blank">ARE.NA</a>

        <span class="ext-pad"></span>
        <a class="ext" href="https://talkingtomyhouseplants.com/" target="_blank">WRITING</a>

      </div>
    </div>

    <div class="col-mid">
      <p>under construction</p>
    </div>

    <div class="col-right"></div>

  </div>

  <script>
    // Mobile nav toggle
    (function() {
      const hamburger = document.getElementById('hamburger');
      const colLeft   = document.querySelector('.col-left');
      const navClose  = document.getElementById('nav-close');
      if (!hamburger || !colLeft) return;
      hamburger.addEventListener('click', () => colLeft.classList.toggle('nav-open'));
      if (navClose) navClose.addEventListener('click', () => colLeft.classList.remove('nav-open'));
      colLeft.querySelectorAll('a').forEach(a => {
        a.addEventListener('click', () => colLeft.classList.remove('nav-open'));
      });
    })();
  </script>
</body>
</html>
